# Configuracion de nginx como proxy inverso
# Recibe las peticiones de app.miempresa.local y las manda a la aplicacion
# que esta corriendo en un contenedor Docker en el puerto 3000

server {
    listen 80;
    server_name app.miempresa.local;

    # tamano maximo de lo que se puede subir
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;

        # estos encabezados sirven para que la app sepa quien hizo la peticion
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # registros para revisar errores
    access_log /var/log/nginx/app.miempresa.local.access.log;
    error_log  /var/log/nginx/app.miempresa.local.error.log;
}
